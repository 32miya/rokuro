<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ろくろ</title>
<style>
:root{
  --bg:#dfe2e4; --bg2:#c9ced3; --ink:#1f2b44; --sub:#56627a; --panel:#f3f4f2; --line:#b9c0c8;
  --accent:#2f4f86; --accent-ink:#f3f1ea; --pan:#3a3f48; --gold:#9a7a22;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141c2e; --bg2:#1f2b44; --ink:#e9e3d6; --sub:#9aa5bb; --panel:#1b2539; --line:#33415e;
    --accent:#d9b45a; --accent-ink:#141c2e; --pan:#0c111c; --gold:#d9b45a;
  }
}
:root[data-theme="dark"]{
  --bg:#141c2e; --bg2:#1f2b44; --ink:#e9e3d6; --sub:#9aa5bb; --panel:#1b2539; --line:#33415e;
  --accent:#d9b45a; --accent-ink:#141c2e; --pan:#0c111c; --gold:#d9b45a;
}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:baseline;gap:10px;padding:10px 16px 0}
h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;font-size:24px;letter-spacing:.3em}
#sub{color:var(--sub);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#titleChip{flex:0 0 auto;align-self:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;background:var(--ink);color:var(--bg);border:none}
.tier{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--sub)}
.tier.got{color:var(--ink);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tier.now{outline:2px solid var(--accent)}
.tier b{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 10px}
.ach{border:1px dashed var(--line);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--sub);line-height:1.4}
.ach b{display:block;font-size:13px;font-family:"Hiragino Mincho ProN",serif}
.ach.got{border-style:solid;border-color:var(--gold);color:var(--ink)}
.ach.got b{color:var(--gold)}
.sheet h3{font-size:14px;margin:12px 0 4px}
.bigtitle{text-align:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:34px;font-weight:700;letter-spacing:.2em;margin:4px 0 0}
#money{font-weight:700;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums;transition:transform .2s}
#money.bump{transform:scale(1.25)}
.scene{display:none;flex:1;flex-direction:column;min-height:0}
.scene.on{display:flex}
.stage{flex:1;position:relative;min-height:0}
#stage{background:radial-gradient(ellipse 80% 60% at 50% 62%, var(--bg2), var(--bg) 75%)}
#kstage{background:#1a100b}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#orderBar{position:absolute;left:8px;right:8px;top:6px;display:flex;gap:8px;align-items:center;
  background:color-mix(in srgb, var(--panel) 88%, transparent);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;line-height:1.45}
#ordTxt{flex:1;min-width:0}
#ordTxt b{font-size:13px}
#ordBtn{flex:0 0 auto;padding:7px 10px;font-size:13px}
#hint{position:absolute;left:0;right:0;top:64px;text-align:center;font-size:14px;color:var(--sub);pointer-events:none;transition:opacity .8s}
#water{position:absolute;left:10px;bottom:12px;width:60px;height:60px;border-radius:50%;padding:0;
  background:#2f6fb0;color:#fff;border:none;font-family:"Hiragino Mincho ProN",serif;font-size:16px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#water:active{background:#4a8fd4}
#kmsg{position:absolute;left:12px;right:12px;top:10px;text-align:center;font-size:14px;line-height:1.6;color:#f5dfc0;pointer-events:none;text-shadow:0 1px 3px #000}
#kmsg b{font-size:18px}
#kbanner{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:"Hiragino Mincho ProN",serif;font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .3s}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px 6px}
.kctl{padding:10px;display:grid;gap:6px}
.pair{display:grid;grid-template-columns:1fr 1.4fr;gap:6px}
button{
  font:inherit;font-size:14px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 2px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;
}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px}
.tool b{font-size:15px;font-weight:600}
.tool span{font-size:10px;color:var(--sub)}
.tool.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool.on span{color:var(--bg);opacity:.75}
.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.big{padding:16px 0;font-size:17px}
#kDamper{padding:14px 0;font-size:15px}
#kDamper.closed{background:#4a3a5a;color:#f0e6ff;border-color:transparent}
#resultScene{overflow:auto;padding:4px 12px 12px;box-sizing:border-box;align-items:center}
#resultScene .inner{width:100%;max-width:440px}
#result{max-width:100%;max-height:50vh;margin:0 auto;display:block;border-radius:10px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.verdict{text-align:center;margin:8px 0 2px;font-size:14px;line-height:1.55}
.verdict small{color:var(--sub)}
.note{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 2px}
.row{display:grid;gap:6px;margin-top:8px}
.rank{display:inline-block;min-width:1.6em;text-align:center;padding:1px 6px;margin-right:6px;border-radius:6px;font-family:"Hiragino Mincho ProN",serif;font-weight:700;color:#fff;background:#7a7f88}
.rank.良{background:#3f7a52}.rank.稀{background:#2f4f86}.rank.幻{background:linear-gradient(135deg,#1c6fd1,#2bb5a0,#8a3fd1)}.rank.割{background:#3a2a24}
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:rgba(8,12,20,.6);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.modal.show{display:flex}
.sheet{background:var(--panel);border-radius:16px;width:100%;max-width:440px;max-height:100%;overflow:auto;padding:12px;box-sizing:border-box}
.sheet>img{width:100%;display:block;border-radius:10px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.sheet h2{margin:4px 0 2px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:20px;letter-spacing:.2em;text-align:center}
.summary{text-align:center;font-size:13px;color:var(--sub);margin:0 0 6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.card{background:none;border:none;padding:0;text-align:left;color:var(--ink);font-size:12px}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}
.card strong{display:block;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:14px}
.card em{font-style:normal;color:var(--sub)}
.list{display:grid;gap:8px;margin:8px 0}
.item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}
.item .txt{flex:1;min-width:0;font-size:12px;line-height:1.5;color:var(--sub)}
.item .txt b{display:block;font-size:14px;color:var(--ink)}
.item .txt .fee{color:var(--gold);font-weight:700}
.item button{flex:0 0 auto;padding:8px 12px;font-size:13px}
.item canvas{position:static;width:56px;height:72px;flex:0 0 auto;touch-action:auto}
.item.active{border-color:var(--accent);border-width:2px}
.empty{color:var(--sub);text-align:center;padding:30px 10px;font-size:14px}

/* ---- 共通アイコン（後で画像に差し替える場合は .ic を img に置き換える） ---- */
.ic{width:22px;height:22px;flex:0 0 auto;display:block}
/* ---- スプライトアイコン（3〜4コマのアニメーション） ---- */
.spr{display:block;flex:0 0 auto;width:36px;height:36px;background-repeat:no-repeat;background-position:0 0}
.tool .spr{width:36px;height:36px;margin-bottom:-2px}
.hubGrid .spr{width:46px;height:46px}
.start .spr{width:48px;height:48px}
#water .spr{width:36px;height:36px}
#done .spr{width:34px;height:34px}
#kLight .spr,#kOut .spr,#kDamper .spr{width:34px;height:34px}
#kLight,#kOut,#kDamper{display:flex;align-items:center;justify-content:center;gap:8px}
#water{background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--ink);border:1px solid var(--line);width:62px;height:62px}
/* ---- 背景画像 ---- */
#hubScene{background:linear-gradient(rgba(20,14,10,.05),rgba(20,14,10,.45)),var(--bgHub) center/cover no-repeat}
#stage{background:none;isolation:isolate}
#stage::before{content:"";position:absolute;inset:-8px;z-index:-1;background:var(--bgHub) center 70%/cover no-repeat;filter:blur(3px) brightness(1.05) saturate(.9);opacity:.85}
#stage::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 70% 55% at 50% 60%, color-mix(in srgb,var(--bg) 55%,transparent), color-mix(in srgb,var(--bg) 20%,transparent))}
#resultScene{background:linear-gradient(color-mix(in srgb,var(--bg) 55%,transparent),color-mix(in srgb,var(--bg) 85%,transparent)),var(--bgResult) center/cover no-repeat}
.hubCard{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hubGrid button{background:color-mix(in srgb,var(--panel) 92%,transparent)}
.hubStats{justify-self:center;color:#f3ead8;background:rgba(20,14,10,.6);padding:4px 12px;border-radius:999px}
/* ---- 工程表示 ---- */
#steps{display:none;gap:4px;padding:6px 12px 0}
#steps.show{display:flex}
#steps span{flex:1;text-align:center;font-size:12px;padding:5px 0;border-radius:999px;color:var(--sub);background:color-mix(in srgb,var(--line) 45%,transparent)}
#steps span.on{background:var(--ink);color:var(--bg);font-weight:700}
#steps span.past{color:var(--ink)}
/* ---- 工房（拠点） ---- */
#hubScene{overflow:auto}
.hub{max-width:460px;width:100%;margin:0 auto;padding:12px;box-sizing:border-box;display:grid;gap:10px;align-content:start}
.hubCard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;line-height:1.6}
.hubCard .lbl{font-size:11px;color:var(--sub);letter-spacing:.1em}
.hubCard .big{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:22px;font-weight:700;padding:0}
.hubRow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.warn{color:#c0392b;font-weight:700}
.start{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 0;font-size:18px;border-radius:14px;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.2em}
.start .ic{width:28px;height:28px}
.hubGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hubGrid button{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 0;font-size:15px;border-radius:12px;position:relative}
.hubGrid button small{position:absolute;top:6px;right:8px;font-size:10px;color:var(--gold);font-weight:700}
.hubStats{text-align:center;font-size:12px;color:var(--sub);margin:2px 0 0}
/* ---- ろくろ画面 ---- */
#orderBar{cursor:pointer}
#orderBar .chev{color:var(--sub);font-size:12px;flex:0 0 auto}
.side{position:absolute;right:10px;bottom:30px;display:grid;gap:8px}
.side button{width:48px;height:48px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:1px}
.side .ic{width:18px;height:18px}
#water{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
#water .ic{width:24px;height:24px}
.tool{flex-direction:column}
.tool .ic{margin-bottom:1px}
.bottomBar{display:grid;grid-template-columns:auto 1fr;gap:6px;padding:0 10px 10px}
.bottomBar button{display:flex;align-items:center;justify-content:center;gap:6px}
#toHub{padding:12px 14px}
#done{font-size:16px;padding:13px 0}
/* ---- 窯の準備カード ---- */
#kCard{position:absolute;left:12px;right:30px;top:12px;background:rgba(20,12,8,.82);border:1px solid rgba(217,180,90,.4);border-radius:14px;padding:12px 14px;color:#f5dfc0;font-size:13px;line-height:1.6}
#kCard h4{margin:0 0 4px;font-family:"Hiragino Mincho ProN",serif;font-size:17px}
#kCard .meter{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin:4px 0 8px}
#kCard .meter i{display:block;height:100%}
#kCard .cost{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.15);margin-top:8px;padding-top:6px}
/* ---- 師匠の助言 ---- */
.master{display:flex;gap:10px;align-items:flex-start;text-align:left}
.master .face{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--master-face, var(--ink));color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN",serif;font-weight:700;background-size:cover}
@media (prefers-reduced-motion: reduce){#hint,#kbanner,#money{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header><h1>ろくろ</h1><span id="sub"></span><button id="titleChip">見習い</button><span id="money">¥0</span></header>
  <nav id="steps"><span data-s="wheel">① ろくろ</span><span data-s="kiln">② 窯焚き</span><span data-s="result">③ 窯出し</span></nav>

  <section class="scene on" id="hubScene">
    <div class="hub">
      <div class="hubCard" id="hubStatus"></div>
      <div class="hubCard" id="hubOrder"></div>
      <button id="goWheel" class="primary start" data-ic="wheel">ろくろに向かう</button>
      <div class="hubGrid">
        <button id="hOrders" data-ic="order">注文帳</button>
        <button id="hShelf" data-ic="shelf">作品棚</button>
        <button id="hShop" data-ic="shop">道具屋</button>
        <button id="hTitle" data-ic="title">称号</button>
      </div>
      <p class="hubStats" id="hubStats"></p>
    </div>
  </section>

  <section class="scene" id="wheelScene">
    <div class="stage" id="stage">
      <canvas id="c"></canvas>
      <div id="orderBar"><div id="ordTxt"></div><span class="chev">変更 ›</span></div>
      <div id="hint">回っている粘土に指でふれてみよう<br>気泡や小石は正面に来た瞬間にタップ</div>
      <button id="water" data-ic="water">水</button>
      <div class="side"><button id="speed" data-ic="speed">回転</button><button id="reset" data-ic="reset">練り直し</button></div>
    </div>
    <div class="tools" id="tools">
      <button class="tool on" data-t="push" data-ic="push"><b>締める</b><span>細く・高く</span></button>
      <button class="tool" data-t="pull" data-ic="pull"><b>広げる</b><span>太く・低く</span></button>
      <button class="tool" data-t="down" data-ic="down"><b>押さえる</b><span>上から低く</span></button>
      <button class="tool" data-t="open" data-ic="open"><b>口を開く</b><span>てっぺんを触る</span></button>
    </div>
    <div class="bottomBar">
      <button id="toHub" data-ic="back">工房</button>
      <button id="done" class="primary" data-ic="kiln">窯へ運ぶ</button>
    </div>
  </section>

  <section class="scene" id="kilnScene">
    <div class="stage" id="kstage">
      <canvas id="kc"></canvas>
      <div id="kmsg"></div>
      <div id="kCard"></div>
      <div id="kbanner"></div>
    </div>
    <div class="kctl">
      <div class="pair" id="kPre"><button id="kBack">ろくろに戻る</button><button id="kLight" class="primary big" data-ic="kiln">火を入れる</button></div>
      <button id="kDamper" style="display:none" data-ic="damper">ダンパーを閉じる（還元焼成）</button>
      <button id="kOut" class="primary big" style="display:none" data-ic="kiln">窯出しする</button>
    </div>
  </section>

  <section class="scene" id="resultScene">
    <div class="inner">
      <img id="result" alt="焼き上がった器">
      <p class="verdict" id="verdict"></p>
      <p class="note">画像を長押しすると写真に保存できます</p>
      <div class="row" id="resBtns"></div>
    </div>
  </section>
</div>

<div class="modal" id="gallery">
  <div class="sheet">
    <h2>作品棚</h2>
    <p class="summary" id="summary"></p>
    <div class="cards" id="grid"></div>
    <div class="row"><button id="galClose">閉じる</button></div>
  </div>
</div>

<div class="modal" id="viewer">
  <div class="sheet">
    <img id="vimg" alt="作品">
    <p class="verdict" id="vinfo"></p>
    <p class="note">長押しで写真に保存</p>
    <div class="row" style="grid-template-columns:1fr 1fr"><button id="vsell" class="primary">売る</button><button id="vclose">閉じる</button></div>
  </div>
</div>

<div class="modal" id="orders">
  <div class="sheet">
    <h2>注文帳</h2>
    <p class="summary">見本の形に近いほど報酬が上がります</p>
    <div class="list" id="ordList"></div>
    <div class="row" style="grid-template-columns:1fr 1fr"><button id="ordFree">自由制作にする</button><button id="ordClose">閉じる</button></div>
  </div>
</div>

<div class="modal" id="titles">
  <div class="sheet">
    <h2>称号</h2>
    <p class="bigtitle" id="tNow"></p>
    <p class="summary" id="tFame"></p>
    <div class="bar"><i id="tBar"></i></div>
    <div id="tList"></div>
    <p class="note">称号が上がるほど、注文の報酬が増えます（1段ごとに＋5%）</p>
    <h3>銘の記録（実績）</h3>
    <div class="achs" id="aList"></div>
    <div class="row"><button id="tClose">閉じる</button></div>
  </div>
</div>

<div class="modal" id="notice">
  <div class="sheet">
    <h2 id="nTitle"></h2>
    <p class="verdict" id="nText"></p>
    <div class="row"><button id="nOk" class="primary">わかった</button></div>
  </div>
</div>

<div class="modal" id="over">
  <div class="sheet">
    <h2>経営破綻</h2>
    <p class="verdict" id="overText"></p>
    <div class="row"><button id="rebuild" class="primary big">工房を再建する（最初から）</button></div>
  </div>
</div>

<div class="modal" id="shop">
  <div class="sheet">
    <h2>工房</h2>
    <p class="summary" id="shopMoney"></p>
    <div class="list" id="shopList"></div>
    <div class="row"><button id="shopClose">閉じる</button></div>
  </div>
</div>

// ---------- shading ----------
function makeShade(rgb, exp, str, amb=0.28){
  const c=document.createElement('canvas'); c.width=128; c.height=1;
  const x=c.getContext('2d'); const im=x.createImageData(128,1);
  const lx=-0.55, lz=0.83, hx=lx, hz=lz+1, hl=Math.hypot(hx,hz);
  for (let i=0;i<128;i++){
    const u=(i+0.5)/128*2-1, nz=Math.sqrt(Math.max(0,1-u*u));
    let l = amb + (1-amb)*Math.max(0,u*lx+nz*lz);
    l *= 0.72 + 0.28*nz;
    const sp = str>0 ? Math.pow(Math.max(0,(u*hx+nz*hz)/hl), exp)*str : 0;
    for (let k=0;k<3;k++) im.data[i*4+k] = clamp(rgb[k]*l + 255*sp, 0, 255);
    im.data[i*4+3]=255;
  }
  x.putImageData(im,0,0); return c;
}
const WET = [150,104,78], DRY=[192,156,126], BISQUE=[196,140,104];
const bisque = makeShade(BISQUE, 1, 0, 0.3);
const moistShades={};
function shadeFor(m){
  const k=Math.round(clamp(m,0,1.3)*10);
  if (!moistShades[k]){ const f=clamp(k/10,0,1); const rgb=DRY.map((v,i)=>v+(WET[i]-v)*f);
    moistShades[k]=makeShade(rgb,14,0.24*Math.min(1.2,k/10),0.32); }
  return moistShades[k];
}
const specks = Array.from({length:150},()=>({
  t:Math.random(), a:Math.random()*Math.PI*2, z:0.6+Math.random()*1.4,
  col:Math.random()<0.55?'#4e3121':'#d2ac8a', alpha:0.35+Math.random()*0.35
}));
function rAtFn(t){ const f=clamp(t,0,1)*(N-1); const i=Math.floor(f); const j=Math.min(N-1,i+1); return P[i]+(P[j]-P[i])*(f-i); }
function ellipseShade(c,cx,cy,rx,ry,sh,rot=0){
  if (rx<0.5) return;
  c.save(); c.beginPath(); c.ellipse(cx,cy,rx,Math.max(ry,0.5),rot,0,Math.PI*2); c.clip();
  c.drawImage(sh,0,0,128,1,cx-rx,cy-ry-2,2*rx,2*ry+4); c.restore();
}
const NOWARP = ()=>({dx:0,k:1});

function drawPot(c,o){
  const {cx,baseY,s}=o, hpx=H*s, topY=baseY-hpx, wf=o.wf||NOWARP;
  const footT = o.foot ? o.foot/H : 0;
  ellipseShade(c,cx,baseY,P[0]*s,P[0]*s*TILT, o.foot?o.footShade:o.shade);
  const dt = 2/(N-1);
  for (let py=Math.ceil(baseY)-1; py>=Math.floor(topY); py--){
    const t=(baseY-py)/hpx, w=wf(t), r=rAtFn(t)*s*w.k, x0=cx+w.dx-r; if (r<0.5) continue;
    let sh=o.shade;
    if (o.foot && t<footT) sh=o.footShade;
    else if (o.rimShade && t>1-o.rimW) sh=o.rimShade;
    c.drawImage(sh,0,0,128,1,x0,py,2*r,1.3);
    const dr=(rAtFn(t+dt/2)-rAtFn(t-dt/2))/(dt*H);
    const tilt=Math.atan(-dr)/(Math.PI/2);
    if (Math.abs(tilt)>0.03){
      c.globalAlpha=Math.min(0.32,Math.abs(tilt)*0.45);
      c.fillStyle=tilt>0?'#fff':'#000'; c.fillRect(x0,py,2*r,1.3); c.globalAlpha=1;
    }
    if (o.rings && Math.sin(t*H*0.85)>0.65){
      c.globalAlpha=0.08; c.fillStyle='#000'; c.fillRect(x0,py,2*r,1.3); c.globalAlpha=1;
    }
  }
  if (o.specks){
    for (const k of o.specks){
      const a=k.a+(o.phase||0), co=Math.cos(a); if (co<0.12) continue;
      if (o.foot && k.t<footT) continue;
      const w=wf(k.t), r=rAtFn(k.t)*s*w.k, x=cx+w.dx+r*Math.sin(a), y=baseY-k.t*hpx;
      if (k.halo){ c.globalAlpha=co*k.alpha*0.28; c.fillStyle=k.col;
        c.beginPath(); c.ellipse(x,y,Math.max(0.4,k.z*s*co*1.6),k.z*s*1.3,0,0,Math.PI*2); c.fill(); }
      c.globalAlpha=co*k.alpha; c.fillStyle=k.col;
      c.beginPath(); c.ellipse(x,y,Math.max(0.4,k.z*s*co*0.7),k.z*s*0.55,0,0,Math.PI*2); c.fill();
    }
    c.globalAlpha=1;
  }
  const w1=wf(1), rt=rAtFn(1)*s*w1.k, tx=cx+w1.dx, rot=o.capRot||0, ryf=o.capRy||1;
  if (rt>1){
    ellipseShade(c,tx,topY,rt,rt*TILT*ryf,o.rimShade||o.shade,rot);
    c.globalAlpha=0.2; c.fillStyle='#fff'; c.beginPath(); c.ellipse(tx,topY,rt,rt*TILT*ryf,rot,0,Math.PI*2); c.fill(); c.globalAlpha=1;
    const wall=Math.max(3*s, rt*0.14), hr=Math.max(0,rt-wall)*clamp(open,0,1);
    if (hr>1){
      const ry=hr*TILT*ryf, ir=o.inner;
      const g=c.createLinearGradient(0,topY-ry,0,topY+ry);
      g.addColorStop(0,`rgb(${ir.map(v=>v*0.6|0)})`); g.addColorStop(1,`rgb(${ir.map(v=>v*0.18|0)})`);
      c.fillStyle=g; c.beginPath(); c.ellipse(tx,topY,hr,ry,rot,0,Math.PI*2); c.fill();
    }
  }
}

function tplF(pts,t){
  for (let i=1;i<pts.length;i++) if (t<=pts[i][0]){
    const [t0,r0]=pts[i-1],[t1,r1]=pts[i], u=(t-t0)/(t1-t0), s=u*u*(3-2*u); return r0+(r1-r0)*s; }
  return pts[pts.length-1][1];
}
function targetOf(o){
  const tp=TPL[o.type]; let m=0; for(let i=0;i<64;i++){ const f=tplF(tp.pts,i/63); m+=f*f; } m/=64;
  let R=Math.cbrt(V/(2*tp.a*m)), Ht=2*tp.a*R;
  if (Ht>MAXH*0.95){ Ht=MAXH*0.95; R=Math.sqrt(V/(Ht*m)); }
  R=Math.min(R,MAXR);
  return {R,H:Ht,f:t=>tplF(tp.pts,clamp(t,0,1))*R};
}

    const r1=y<=H?rAtFn(y/H):0, r2=y<=tg.H?tg.f(y/tg.H):0; a+=Math.min(r1,r2); b+=Math.max(r1,r2); }

  if (open<0.5) s*=0.6;
  return Math.round(s);
}

  if (H>MAXH||H<MINH){ H=clamp(H,MINH,MAXH); const f=Math.sqrt(V/(H*m)); for(let i=0;i<N;i++) P[i]=clamp(P[i]*f,MINR,MAXR); }

  if (touched){ nextDefect-=dt; if (nextDefect<=0){
    if (defects.length<5) defects.push({t:0.12+Math.random()*0.8,a:Math.random()*Math.PI*2,type:Math.random()<0.6?'bubble':'stone',z:3+Math.random()*2});
    nextDefect=3+Math.random()*4; } }
  for (const p of pops) p.life+=dt; pops=pops.filter(p=>p.life<0.4);
  for (const d of drops){ d.life+=dt; d.y+=d.vy*dt; } drops=drops.filter(d=>d.life<0.6);
  for (const f of floatTxt){ f.life+=dt; f.y-=20*dt; } floatTxt=floatTxt.filter(f=>f.life<1);
  if (!ptrs.size) return;
  let reshape=false;
  const wetK=0.35+0.65*clamp(moist/0.5,0,1), rough=Math.max(0,0.35-moist)*70;
  for (const p of ptrs.values()){
    const t=(L.baseY-p.y)/(H*L.s), xd=Math.abs(p.x-L.cx)/L.s, sig=11/H;
    if (tool==='push'||tool==='pull'){
      if (t<-0.06||t>1.06) continue;
      const rate=85*dt*wetK;
      for (let i=0;i<N;i++){
        const g=(i/(N-1)-t)/sig; if (Math.abs(g)>3) continue;
        const w=Math.exp(-g*g); let d=Math.max(MINR,xd)-P[i];
        if (tool==='push'){ if(d>=0) continue; d=Math.max(d,-rate); }
        else { if(d<=0||xd>MAXR+30) continue; d=Math.min(d,rate); }
        P[i]+=d*w; if (rough>0 && w>0.2) P[i]+=(Math.random()-.5)*rough*dt*2*w;
        reshape=true;
      }
    } else if (tool==='down'){
      const th=(L.baseY-p.y)/L.s;
      if (th>0 && th<H && xd<MAXR){ H=Math.max(MINH,H-Math.min(H-th,70*dt*wetK)); rescale(); smooth(0.04); }
    } else if (tool==='open'){
      if (t>0.72 && t<1.25 && xd<rAtFn(1)+12) open=Math.min(1,open+dt*0.8*wetK);
    }
  }
  if (reshape){ smooth(0.06); conserve(); }
}
function drawGhost(c,o,fill){
  const tg=targetOf(o), s=L.s, cx=L.cx, by=L.baseY;
  c.beginPath();
  for (let i=0;i<=60;i++){ const t=i/60; c.lineTo(cx-tg.f(t)*s, by-t*tg.H*s); }
  for (let i=60;i>=0;i--){ const t=i/60; c.lineTo(cx+tg.f(t)*s, by-t*tg.H*s); }
  c.closePath();
  if (fill){ c.fillStyle='rgba(255,255,255,.18)'; c.fill(); }
  else { c.setLineDash([6,5]); c.lineWidth=2; c.strokeStyle='rgba(47,79,134,.75)'; c.stroke(); c.setLineDash([]); }
}

const TSTOPS=[[20,[26,13,8]],[600,[90,20,6]],[900,[196,61,14]],[1150,[255,138,31]],[1300,[255,210,122]],[1500,[255,246,226]]];
function tempRGB(T){
  for (let i=1;i<TSTOPS.length;i++){ const [t1,c1]=TSTOPS[i-1],[t2,c2]=TSTOPS[i];
    if (T<=t2){ const f=clamp((T-t1)/(t2-t1),0,1); return c1.map((v,k)=>v+(c2[k]-v)*f); } }
  return TSTOPS[TSTOPS.length-1][1];
}
function archPath(c){
  const {cx,bot,mw,mh}=KL, r=mw/2;
  c.beginPath(); c.moveTo(cx-r,bot); c.lineTo(cx-r,bot-mh+r); c.arc(cx,bot-mh+r,r,Math.PI,0); c.lineTo(cx+r,bot); c.closePath();
}
function shapeRisk(){
  const mx=maxR(), ratio=H/(2*mx);
  let minR=1e9; for(let i=4;i<N-2;i++) minR=Math.min(minR,P[i]);
  let over=0; const step=8, dh=step/(N-1)*H; for(let i=0;i<N-step;i++) over=Math.max(over,(P[i+step]-P[i])/dh);
  let r=0;
  if (open<0.25) r+=0.35;
  if (ratio>2) r+=Math.min(0.3,(ratio-2)*0.15);
  if (minR<9) r+=0.15;
  if (over>1) r+=Math.min(0.3,(over-1)*0.2);
  if (ratio<0.25 && mx>120) r+=0.1;
  return r;
}

function spawnFlame(boost=1){
  const {cx,bot,mw}=KL;
  K.parts.push({x:cx+(Math.random()-.5)*mw*0.85, y:bot-4, vx:(Math.random()-.5)*20, vy:-(70+Math.random()*110)*boost,
    life:0, max:0.5+Math.random()*0.6, sz:10+Math.random()*18});

function spawnSmoke(x,y,n){ for(let i=0;i<n;i++) K.smoke.push({x:x+(Math.random()-.5)*30,y,vx:(Math.random()-.5)*15,vy:-(25+Math.random()*30),life:0,max:1.4+Math.random(),sz:10+Math.random()*14}); }
function updateKiln(dt){
  const [lo,hi]=band();
  if (K.state==='firing'){
    K.fuel=Math.max(0,K.fuel-(0.25*K.fuel+0.04)*dt);
    K.T += (400*K.fuel*(K.damper?0.75:1) - 0.5*(K.T-20))*dt;
    for (const im of K.imp){ const u=Math.min(dt,im.left); K.T+=im.rate*u; im.left-=dt; }
    K.imp=K.imp.filter(i=>i.left>0); K.T=Math.max(20,K.T);
    K.t+=dt;
    if (K.t>GRACE){
      // 帯の外でも60℃以内なら半分だけ良しとする
      if (K.T>hi+60) K.over+=dt; else if (K.T<lo-60) K.under+=dt;
      else if (K.T>=lo && K.T<=hi) K.inBand+=dt; else K.inBand+=dt*0.5;
      if (K.damper && K.T>=lo) K.red+=dt;
    }
    // 突風
    K.gustT-=dt;
    if (K.t>3 && K.gustT<=0){
      const k=has('nobori')?0.3:has('kiln2')?0.5:1, cold=Math.random()<0.6;
      K.imp.push({rate:(cold?-190:150)*k,left:1.1});
      banner(cold?'突風！ 温度が下がる':'風が吹き込み、火が煽られた');
      K.gustT=4+Math.random()*4;
    }
    // 薪の流れ
    K.logT-=dt;
    if (K.logT<=0){ const r=Math.random(); K.logs.push({type:r<0.58?'dry':r<0.88?'wet':'big',x:KL.W+40,y:KL.belt}); K.logT=0.45+Math.random()*0.3; }
    if (K.damper && Math.random()<dt*6) spawnSmoke(KL.cx,KL.bot-KL.mh+10,1);
    if (K.t>=DUR){ K.state='cooling'; K.cool=0; setKilnButtons(); }
  } else if (K.state==='cooling'){
    K.fuel=0; K.T+= -0.9*(K.T-60)*dt; K.cool+=dt;
    if (K.cool>2.6){ K.state='done'; K.logs=[]; setKilnButtons(); }
  }
  for (const l of K.logs) l.x-=95*dt;
  K.logs=K.logs.filter(l=>l.x>-60);
  for (const f of K.flying){ f.p+=dt/0.35; }
  for (const f of K.flying.filter(f=>f.p>=1)){
    const L2=LOGS[f.type]; K.fuel=Math.min(2.6,K.fuel+L2.fuel);
    if (L2.cool){ K.imp.push({rate:-L2.cool,left:1}); spawnSmoke(KL.cx,KL.bot-20,10); }
    else for(let i=0;i<(f.type==='big'?16:9);i++) spawnFlame(1.4);
  }
  K.flying=K.flying.filter(f=>f.p<1);
  const rate = K.state==='firing' ? 8+K.fuel*22 : K.state==='cooling' ? 3 : 0;
  if (Math.random()<rate*dt) spawnFlame();
  for (const p of K.parts){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy*=0.99; }
  K.parts=K.parts.filter(p=>p.life<p.max);
  for (const p of K.smoke){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.sz+=12*dt; }

function drawLog(c,x,y,type,scale=1){

function drawKiln(){

  const ty=toY(K.T);

}

const availableGlazes=()=>GLAZES.filter(g=>!g.need||has(g.need));
const NAMES=['春霞','夕凪','月白','風花','朝露','山笑','星屑','雪解','青嵐','蛍火','初音','木漏日','千鳥','宵待','水鏡','秋桜','雲母','遠雷','花筏','冬籠'];
function rng32(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rollGlaze(r,q,R){
  const rareK=(0.4+q*1.6)*(has('nobori')?1.5:1);
  const w=GLAZES.map(g=>{
    if (g.need && !has(g.need)) return 0;
    let x=g.w*Math.max(0.15,1+g.red*(R*2-1)*0.9);
    if (g.r==='稀'||g.r==='幻') x*=rareK;
    return x; });
  const tot=w.reduce((a,b)=>a+b,0); let x=r()*tot;
  for(let i=0;i<w.length;i++){ x-=w[i]; if(x<0) return i; } return 0;
}
function shapeType(){
  const mx=maxR(), ratio=H/(2*mx), top=P[N-1]/mx;
  let neck=mx; for(let i=N/2|0;i<N-4;i++) neck=Math.min(neck,P[i]);
  if (open<0.25) return ratio>1.2?'オブジェ（塔）':'オブジェ';
  if (ratio<0.32) return '平皿';
  if (ratio<0.7) return top>0.8?'鉢':'茶碗';
  if (top<0.4 && neck/mx<0.35) return ratio>1.6?'一輪挿し':'徳利';
  if (ratio>1.5) return '花瓶';
  return top>0.75?'湯呑':'壺';
}
function shapeValue(){
  let v=0,mean=0; for(let i=0;i<N;i++) mean+=P[i]; mean/=N;
  for(let i=0;i<N;i++) v+=(P[i]-mean)**2; v=Math.sqrt(v/N);
  return 1200+v*180+H*18+open*1200;
}
function makeWarp(r){
  const lean=(r()-.5)*0.6, wob=(r()-.5)*0.14, fr=1+r()*2, ph=r()*6, sag=(r()-.5)*0.3, fr2=1+r()*3, ph2=r()*6;
  return { capRot:(r()-.5)*0.4, capRy:0.55+r()*1.0,
    make:(hpx,rmax)=>t=>({dx:lean*t*t*hpx*0.3 + wob*rmax*Math.sin(t*Math.PI*fr+ph)*t, k:1+sag*Math.sin(t*Math.PI*fr2+ph2)*t}) };
}

let piece=null;
function makePiece(force){
  const seed=(Math.random()*2**32)>>>0, r=rng32(seed^0x9e3779b9);
  const span=DUR-GRACE, q=K.inBand/span, ov=K.over/span, un=K.under/span, risk=clamp(K.risk,0,0.85);
  const R=K.red/Math.max(1,K.inBand+K.over);
  const f={};
  f.broken = r() < clamp(0.04+risk*0.5+ov*0.7,0,0.9);
  f.under  = !f.broken && q<0.25 && un>0.45;
  f.warp   = !f.broken && r() < clamp(0.08+ov*0.8+risk*0.35,0,0.9);
  f.scenic = f.warp && r()<0.3;
  f.crack  = !f.broken && r() < clamp(0.06+ov*0.35+risk*0.3,0,0.8);
  if (force) Object.assign(f,force);
  const gi=rollGlaze(r,q,R), g=GLAZES[gi], d=new Date();
  let mult=g.m*(0.85+r()*0.3)*(0.6+0.6*q)*(has('nobori')?1.2:1)*(has('bigclay')?1.4:1);
  if (f.under) mult*=0.4;
  if (f.warp) mult*= f.scenic?1.8:0.6;
  if (f.crack) mult*=0.4;
  piece={gi,seed,f,name:NAMES[r()*NAMES.length|0],type:shapeType(),
    price: f.broken?0:Math.round(shapeValue()*mult/100)*100,
    rank: f.broken?'割':g.r, glaze: f.under?g.n+'（生焼け）':g.n,
    date:`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`, q, R};
  // 注文の評価
  const o=activeOrder();
  if (o && !f.broken){
    const sc=matchScore(o);
    let k = sc>=85?1.3 : sc>=70?1 : sc>=55?0.6 : 0;
    const words = sc>=85?'大満足':sc>=70?'満足':sc>=55?'まあまあ':'注文と違う';
    if (f.crack) k*=0.5; if (f.under) k*=0.5; if (f.warp) k*= f.scenic?1.2:0.6;
    const wishHit = o.wish && o.wish===g.n && !f.under; if (wishHit) k*=1.5;
    piece.order={id:o.id,client:o.client,score:sc,words,reward:Math.round(o.fee*k*titleBonus()/100)*100,wishHit};
  }
  const big=renderPiece(piece);
  piece.full=big.toDataURL('image/jpeg',0.9);
  const sm=document.createElement('canvas'); sm.width=450; sm.height=600; sm.getContext('2d').drawImage(big,0,0,450,600);
  piece.thumb=sm.toDataURL('image/jpeg',0.78);

  const tags=[];
  if (f.broken) tags.push('窯の中で割れてしまった');
  else {
    if (f.under) tags.push('火が足りず生焼けになった');
    if (f.warp) tags.push(f.scenic?'歪みが味わいある景色になった':'形が歪んでしまった');
    if (f.crack) tags.push('ひびが入った');
    if (!tags.length) tags.push(q>0.7?'見事な焼き上がり':'無事に焼き上がった');
  }
  // ---- 知名度（値段とは別に、作った事実と出来栄えで上がる） ----
  const gains=[], achs=[];
  unlockAch('first',achs);
  if (f.broken){ W.breaks++; unlockAch('broke',achs); }
  else {
    gains.push(['焼き上げ',1]);
    if (piece.rank==='良') gains.push(['良品',2]);
    if (piece.rank==='稀'){ gains.push(['稀品',6]); unlockAch('rare',achs); }
    if (piece.rank==='幻'){ gains.push(['幻の一品',40]); unlockAch('rare',achs); }
    if (g.n==='曜変天目' && !f.under) unlockAch('yohen',achs);
    if (f.scenic){ gains.push(['景色',4]); unlockAch('scenic',achs); }
    if (q>0.7 && !f.warp && !f.crack && !f.under) gains.push(['見事な焼き',3]);
    if (q>=0.9) unlockAch('perfect',achs);
    if (R>=0.7 && (piece.rank==='稀'||piece.rank==='幻')) unlockAch('reduce',achs);
    if (VESSELS.includes(piece.type) && !W.typesMade[piece.type]){ W.typesMade[piece.type]=1; gains.push(['新しい器種',3]); }
    if (!f.under && !W.glazesMade[g.n]){ W.glazesMade[g.n]=1; gains.push(['新しい釉',3]); }
    if (VESSELS.every(v=>W.typesMade[v])) unlockAch('types',achs);
    if (Object.keys(W.glazesMade).length>=10) unlockAch('glazes',achs);
  }
  if (W.stats.fired>=50) unlockAch('fifty',achs);
  if (W.stats.fired>=100) unlockAch('hundred',achs);
  achs.forEach(()=>gains.push(['実績',5]));
  const fameUp=gainFame(gains);
  let html=`<span class="rank ${piece.rank}">${piece.rank}</span>${piece.glaze}の${piece.type}<br>${tags.join('、')}<br>`;
  if (!f.broken) html+=`売値 ${yen(piece.price)}<br>`;
  if (piece.order){ const po=piece.order;
    html+= po.reward>0 ? `<b>${po.client}：${po.words}（一致${po.score}%）</b>　報酬 ${yen(po.reward)}${po.wishHit?'　ご希望の釉薬！':''}<br>`
                       : `<b>${po.client}：${po.words}（一致${po.score}%）</b>　受け取ってもらえない<br>`; }
  else if (o && f.broken) html+='注文の品は割れてしまった。もう一度つくろう<br>';
  if (fameUp) html+=`<b style="color:var(--gold)">知名度 +${fameUp}</b>　<small>${gains.map(g=>g[0]).join('・')}</small><br>`;
  if (achs.length) html+=`<small style="color:var(--gold)">${achs.join('　')} を獲得</small><br>`;
  html+=`<small>火加減 ${Math.round(q*100)}点　還元 ${Math.round(R*100)}%</small>`;
  $('result').src=piece.full; $('verdict').innerHTML=html;
  setResultButtons();
}
function setResultButtons(){
  const box=$('resBtns'); box.innerHTML='';
  const add=(label,cls,fn,dis)=>{ const b=document.createElement('button'); b.textContent=label; if(cls) b.className=cls; b.disabled=!!dis; b.onclick=()=>fn(b); box.appendChild(b); };
  const f=piece.f;
  if (f.broken){
    box.style.gridTemplateColumns='1.4fr 1fr';
    add('陶片を棚に残す','primary',keepPiece); add('片付けて工房へ','',nextClay); return;
  }
  if (piece.order){
    box.style.gridTemplateColumns='1.3fr 1fr 1fr';
    if (piece.order.reward>0) add('納品 '+yen(piece.order.reward),'primary',deliver);
    else add('受け取り拒否','',()=>{},true);
  } else box.style.gridTemplateColumns='1fr 1fr 1fr';
  add('売る '+yen(piece.price),piece.order?'':'primary',()=>{ W.stats.sold++; earn(piece.price); nextClay(); });
  add('棚に飾る','',keepPiece);
  if (!piece.order) add('処分する','',nextClay);
}
function deliver(){
  earn(piece.order.reward);
  const w=piece.order.words, gs=[], achs=[];
  if (w==='大満足'){ gs.push(['大満足の納品',5]); W.perfectOrders++; if (W.perfectOrders>=10) unlockAch('orders',achs); }
  else if (w==='満足') gs.push(['満足の納品',2]);
  achs.forEach(()=>gs.push(['実績',5]));
  gainFame(gs);
  W.orders=W.orders.filter(o=>o.id!==piece.order.id); W.active=null; fillOrders(); saveW(); refreshUI(); nextClay();
}
async function keepPiece(b){
  b.disabled=true; b.textContent='飾っています…';
  try{
    await Shelf.add({img:piece.thumb,name:piece.f.broken?'陶片':piece.name,glaze:piece.glaze,rank:piece.rank,
      type:piece.type,price:piece.price,date:piece.date,createdAt:Date.now(),v:3});
    b.textContent='飾りました'; setTimeout(nextClay,600);
  }catch(e){ b.disabled=false; b.textContent='保存できず。再試行'; }
}

function renderPiece(pc){
  const g=GLAZES[pc.gi], r=rng32(pc.seed), f=pc.f;
  const k=0.85+r()*0.3;
  let rgb=g.rgb.map(v=>clamp(v*k+(r()-.5)*26,0,255)), e=g.e, st=g.s;
  if (f.under){ rgb=rgb.map((v,i)=>v*0.55+BISQUE[i]*0.45); e=4; st*=0.15; }
  const sh=makeShade(rgb,e,st), rimSh=g.rim&&!f.under?makeShade(g.rim,g.e,g.s):null;
  const spots=[]; (g.spots||[]).forEach(([col,n,z0,z1,halo])=>{ for(let i=0;i<n;i++) spots.push({t:0.08+r()*0.92,a:(r()-.5)*3,z:z0+r()*(z1-z0),col,alpha:(.35+r()*.45)*(f.under?0.4:1),halo}); });
  const W2=900, Hh=1200, c=document.createElement('canvas'); c.width=W2; c.height=Hh; const x=c.getContext('2d');
  if (ready('bg_result')){
    // 窯出しの部屋をぼかして背景にする（縮小→拡大でぼかし）
    const sm=document.createElement('canvas'); sm.width=150; sm.height=200; drawCover(sm.getContext('2d'),IMG.bg_result,150,200,0.35);
    x.imageSmoothingQuality='high'; x.drawImage(sm,0,0,W2,Hh);
    const wash=x.createLinearGradient(0,0,0,Hh); wash.addColorStop(0,'rgba(244,238,228,.92)'); wash.addColorStop(.25,'rgba(244,238,228,.55)'); wash.addColorStop(.55,'rgba(244,238,228,.1)'); wash.addColorStop(1,'rgba(30,20,12,.55)');
    x.fillStyle=wash; x.fillRect(0,0,W2,Hh);
  } else {
    const bg=x.createLinearGradient(0,0,0,Hh); bg.addColorStop(0,'#e6e2da'); bg.addColorStop(.72,'#cfc8bc'); bg.addColorStop(.72,'#3a2c22'); bg.addColorStop(1,'#241a14');
    x.fillStyle=bg; x.fillRect(0,0,W2,Hh);
  }
  const mx=maxR(), s=Math.min(W2*0.62/(2*mx), Hh*0.5/H), baseY=Hh*0.8, cx=W2/2, hpx=H*s;
  const warp=f.warp?makeWarp(rng32(pc.seed+7)):null;
  const wf=warp?warp.make(hpx,mx*s):NOWARP;
  const pot=document.createElement('canvas'); pot.width=W2; pot.height=Hh; const px=pot.getContext('2d');
  drawPot(px,{cx,baseY,s,shade:sh,foot:g.bare?0:Math.min(8,H*0.1),footShade:bisque,rimShade:rimSh,rimW:0.07,
    specks:spots,phase:0,inner:rgb,wf,capRot:warp?warp.capRot:0,capRy:warp?warp.capRy:1});
  if (f.crack || f.broken) drawCrack(px,cx,baseY,s,hpx,wf,rng32(pc.seed+3));
  if (!f.broken){
    const shd=x.createRadialGradient(cx,baseY,0,cx,baseY,P[0]*s*1.8);
    shd.addColorStop(0,'rgba(0,0,0,.55)'); shd.addColorStop(1,'rgba(0,0,0,0)');
    x.save(); x.translate(cx,baseY); x.scale(1,TILT*1.4); x.translate(-cx,-baseY);
    x.fillStyle=shd; x.beginPath(); x.arc(cx,baseY,P[0]*s*1.8,0,Math.PI*2); x.fill(); x.restore();
    x.drawImage(pot,0,0);
  } else shatter(x,pot,cx,baseY,mx*s,hpx,rng32(pc.seed+11),Hh);
  x.textAlign='center'; x.fillStyle='#1f2b44';
  x.font='600 64px "Hiragino Mincho ProN","Yu Mincho",serif';
  x.fillText(f.broken?'割れてしまった':'銘「'+pc.name+'」',cx,130);
  x.font='32px "Hiragino Mincho ProN","Yu Mincho",serif'; x.fillStyle='#56627a';
  const extra=[f.warp&&(f.scenic?'歪み・景色':'歪み'),f.crack&&'ひび'].filter(Boolean).join('・');
  x.fillText(pc.glaze+'　'+pc.type+(extra&&!f.broken?'　'+extra:''),cx,186);
  x.font='26px "Hiragino Sans",sans-serif';
  x.fillText(f.broken?'陶片':'鑑定額 '+yen(pc.price),cx,232);
  x.fillStyle=f.broken?'#3a2a24':'#b23a2a'; x.fillRect(W2-150,Hh-150,84,84);
  x.fillStyle='#f3ead8'; x.font='600 54px "Hiragino Mincho ProN",serif'; x.fillText(pc.rank,W2-108,Hh-89);
  x.fillStyle='rgba(243,234,216,.6)'; x.font='22px "Hiragino Sans",sans-serif'; x.textAlign='left'; x.fillText(pc.date+'　作 '+titleNow(),60,Hh-80);
  return c;
}
function drawCrack(c,cx,baseY,s,hpx,wf,r){
  const line=(t0,t1,x0)=>{
    const pts=[]; let xo=x0;
    for (let t=t0;t>t1;t-=0.035){ const w=wf(t), rr=rAtFn(t)*s*w.k; xo=clamp(xo+(r()-.5)*0.35,-0.8,0.8); pts.push([cx+w.dx+xo*rr, baseY-t*hpx]); }
    c.lineJoin='round';
    c.strokeStyle='rgba(20,12,8,.85)'; c.lineWidth=4; c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p)); c.stroke();
    c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=1.2; c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0]+2.5,p[1]):c.moveTo(p[0]+2.5,p[1])); c.stroke();
  };
  const tEnd=0.25+r()*0.3, xs=(r()-.5)*0.6;
  line(1,tEnd,xs);
  const tb=0.6+r()*0.3; line(tb,tb-0.2-r()*0.2,xs+(r()-.5)*0.4);
}
function shatter(x,pot,cx,baseY,rx,hpx,r,Hh){
  const x0=cx-rx-10, x1=cx+rx+10, y0=baseY-hpx-rx*TILT-10, y1=baseY+rx*TILT+10;
  const cols=6, rows=7, pts=[];
  for (let j=0;j<=rows;j++){ pts[j]=[]; for (let i=0;i<=cols;i++){
    const jx=(i>0&&i<cols)?(r()-.5)*0.7:0, jy=(j>0&&j<rows)?(r()-.5)*0.7:0;
    pts[j][i]=[x0+(i+jx)/cols*(x1-x0), y0+(j+jy)/rows*(y1-y0)]; } }
  const tris=[];
  for (let j=0;j<rows;j++) for (let i=0;i<cols;i++){
    const a=pts[j][i],b=pts[j][i+1],c2=pts[j+1][i+1],d=pts[j+1][i];
    if (r()<.5) tris.push([a,b,c2],[a,c2,d]); else tris.push([a,b,d],[b,c2,d]);
  }
  const floor=Hh*0.74;
  for (const t of tris){
    const gx=(t[0][0]+t[1][0]+t[2][0])/3, gy=(t[0][1]+t[1][1]+t[2][1])/3;
    const tx=cx+(gx-cx)*1.3+(r()-.5)*90, ty=floor+50+r()*(Hh*0.13), rot=(r()-.5)*2.4;
    x.save(); x.translate(tx,ty); x.rotate(rot); x.scale(0.75,0.75); x.translate(-gx,-gy);
    x.beginPath(); x.moveTo(...t[0]); x.lineTo(...t[1]); x.lineTo(...t[2]); x.closePath(); x.clip();
    x.shadowColor='rgba(0,0,0,.5)'; x.shadowBlur=12; x.shadowOffsetY=6;
    x.drawImage(pot,0,0); x.restore();
  }
}

      notice('家賃の支払い',`工房の家賃 ${yen(r)} を支払いました。<br>残金 ${yen(W.money)}`); }

// ================= 注文帳 =================
function drawThumbShape(cvs,o){
  const dpr=2; cvs.width=56*dpr; cvs.height=72*dpr; const c=cvs.getContext('2d'); c.scale(dpr,dpr);
  const tp=TPL[o.type], a=tp.a, Hn=62, R=Math.min(24,Hn/(2*a));
  const Ht=Math.min(Hn,2*a*R);
  c.fillStyle=getComputedStyle(document.body).color; c.globalAlpha=0.75;
  c.beginPath();
  for (let i=0;i<=40;i++){ const t=i/40; c.lineTo(28-tplF(tp.pts,t)*R, 68-t*Ht); }
  for (let i=40;i>=0;i--){ const t=i/40; c.lineTo(28+tplF(tp.pts,t)*R, 68-t*Ht); }
  c.closePath(); c.fill();
}
function openOrders(){
  fillOrders(); const list=$('ordList'); list.innerHTML='';

    const it=document.createElement('div'); it.className='item'+(o.id===W.active?' active':'');
    const cvs=document.createElement('canvas'); drawThumbShape(cvs,o); it.appendChild(cvs);
    const tx=document.createElement('div'); tx.className='txt';
    tx.innerHTML=`<b></b><span class="q"></span><br><span class="fee">報酬 ${yen(o.fee)}</span>`+(o.wish?`　${o.wish}なら1.5倍`:'');
    tx.querySelector('b').textContent=o.client; tx.querySelector('.q').textContent='「'+o.text+'」';
    it.appendChild(tx);
    const b=document.createElement('button');
    b.textContent=o.id===W.active?'受注中':'受ける'; b.disabled=o.id===W.active; if(o.id!==W.active) b.className='primary';
    b.onclick=()=>{ W.active=o.id; saveW(); refreshUI(); $('orders').classList.remove('show'); if(cur==='hub') renderHub(); };
    it.appendChild(b); list.appendChild(it);
  });
  $('orders').classList.add('show');
}

// ================= 作品棚 =================
const loadLocal=()=>{ try{ return JSON.parse(localStorage.getItem(LKEY)||'[]'); }catch(e){ return []; } };
const saveLocal=a=>{ localStorage.setItem(LKEY,JSON.stringify(a)); };
const Shelf={
  async list(){ await Cloud.ready;
    if(Cloud.col){ const s=await Cloud.col.orderBy('createdAt','desc').limit(300).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
    return loadLocal(); },
  async add(it){ await Cloud.ready;
    if(Cloud.col){ await Cloud.col.doc().set(it); return; }
    const a=loadLocal(); a.unshift({id:'p'+Date.now(),...it}); while(a.length>40) a.pop(); saveLocal(a); },
  async remove(id){ await Cloud.ready;
    if(Cloud.col){ await Cloud.col.doc(id).delete(); return; }
    saveLocal(loadLocal().filter(p=>p.id!==id)); }
};
let items=[], viewItem=null;
async function openGallery(){
  const g=$('grid'); g.innerHTML='<div class="empty" style="grid-column:1/-1">棚を開いています…</div>'; $('summary').textContent='';
  $('gallery').classList.add('show');
  try{ items=await Shelf.list(); }catch(e){ g.innerHTML='<div class="empty" style="grid-column:1/-1">棚を読み込めませんでした。閉じてもう一度開いてください。</div>'; return; }
  g.innerHTML='';
  if(!items.length){ g.innerHTML='<div class="empty" style="grid-column:1/-1">まだ作品がありません。<br>焼き上げた器を「棚に飾る」と、ここに並びます。</div>'; return; }
  const total=items.reduce((a,p)=>a+(p.v===3?(p.price||0):0),0);
  const cnt={}; items.forEach(p=>cnt[p.rank]=(cnt[p.rank]||0)+1);
  $('summary').textContent=`${items.length}点　売れる額 ${yen(total)}　`+['幻','稀','良','並','割'].filter(r=>cnt[r]).map(r=>r+cnt[r]).join('　');
  items.forEach(p=>{
    const b=document.createElement('button'); b.className='card';
    b.innerHTML=`<img alt=""><strong></strong><em></em>`;
    b.querySelector('img').src=p.img;
    b.querySelector('strong').textContent=p.rank==='割'?'陶片':'「'+p.name+'」';
    const em=b.querySelector('em'); em.innerHTML=`<span class="rank ${p.rank}">${p.rank}</span>`;
    em.append(`${p.glaze}の${p.type}`+(p.rank==='割'?'':`　${yen(p.price)}`));
    b.onclick=()=>{ viewItem=p; $('vimg').src=p.img;
      $('vinfo').textContent=(p.rank==='割'?'陶片　':`「${p.name}」`)+`${p.glaze}の${p.type}　`+(p.rank==='割'?'':yen(p.price)+'　')+p.date;
      const sellable=p.v===3&&p.price>0;
      $('vsell').textContent=p.rank==='割'?'処分する':sellable?'売る '+yen(p.price):'旧作のため売れない';
      $('vsell').disabled=!sellable&&p.rank!=='割';
      $('viewer').classList.add('show'); };
    g.appendChild(b);
  });
}
$('hShelf').onclick=openGallery; $('hTitle').onclick=()=>openTitles();
$('galClose').onclick=()=>$('gallery').classList.remove('show');
$('vclose').onclick=()=>$('viewer').classList.remove('show');
$('vsell').onclick=async()=>{
  const b=$('vsell'); b.disabled=true;
  try{ await Shelf.remove(viewItem.id); if (viewItem.v===3&&viewItem.price){ W.stats.sold++; earn(viewItem.price); } }catch(e){}
  b.disabled=false; $('viewer').classList.remove('show'); openGallery(); checkMoney();
};

// ================= ループ =================
let last=performance.now(), scoreT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if (cur==='wheel'){
    updateWheel(dt); drawWheelScene();
    scoreT-=dt; if (scoreT<=0){ scoreT=0.25; const o=activeOrder(), el=$('liveScore'); if (o&&el) el.textContent=matchScore(o); }
  } else if (cur==='kiln'){ updateKiln(dt); drawKiln(); }
  requestAnimationFrame(frame);
}
if (location.search.includes('debug')) window._rk={makePiece,openTitles,scene,W:()=>W,K,checkMoney,setW:o=>{Object.assign(W,o);refreshUI();}};
newClay(); fillOrders(); refreshUI(); resize(); requestAnimationFrame(frame); scene('hub');
loadWorkshop();
})();
